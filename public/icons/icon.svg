<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="شعار أكاديمية طلاقة">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="90%">
      <stop offset="0" stop-color="#17573F"/>
      <stop offset="1" stop-color="#072A20"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C868"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8C6A14"/>
    </linearGradient>
    <path id="ring" d="M256,256 m-176,0 a176,176 0 1,1 352,0 a176,176 0 1,1 -352,0"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- الختم الخارجي -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#C9A227" stroke-width="10" opacity="0.95"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#C9A227" stroke-width="4" opacity="0.85"/>
  <text font-family="Amiri, 'Traditional Arabic', serif" font-size="30" fill="#E7C868" letter-spacing="2">
    <textPath href="#ring" startOffset="0%">طَلَاقَة ✦ TALAQA ✦ من الصفر إلى C2 ✦ FROM ZERO TO C2 ✦ طَلَاقَة ✦ TALAQA ✦</textPath>
  </text>

  <!-- المنارة والكتاب المفتوح -->
  <g fill="url(#gold)" stroke="#072A20" stroke-width="3" stroke-linejoin="round">
    <!-- الهلال -->
    <path d="M256 92 a17 17 0 1 1 -11 30 a13.5 13.5 0 1 0 11 -30 Z" opacity="0.96"/>
    <!-- القبة -->
    <path d="M256 128 c-34 0 -52 22 -52 44 h104 c0 -22 -18 -44 -52 -44 Z"/>
    <rect x="196" y="172" width="120" height="9" rx="2"/>
    <!-- جسم المنارة: طبقات متناقصة -->
    <path d="M214 188 h84 l-9 34 h-66 Z"/>
    <rect x="206" y="222" width="100" height="8" rx="2"/>
    <path d="M219 230 h74 l-8 32 h-58 Z"/>
    <rect x="212" y="262" width="88" height="8" rx="2"/>
    <path d="M224 270 h64 v30 h-64 Z"/>
    <!-- الكتاب المفتوح -->
    <path d="M256 330 c-22 -12 -48 -12 -70 2 v34 c22 -14 48 -14 70 -2 c22 -12 48 -12 70 2 v-34 c-22 -14 -48 -14 -70 -2 Z"/>
    <path d="M256 330 v34" fill="none"/>
  </g>
</svg>
